services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    expose:
      - "8000"
    environment:
      JBB_ENVIRONMENT: ${JBB_ENVIRONMENT:-production}
      JBB_BUILD_VERSION: ${JBB_BUILD_VERSION:-unknown}
      JBB_DATA_DIR: /app/data
      JBB_ADMIN_EMAILS: ${JBB_ADMIN_EMAILS:-}
      JBB_MAX_UPLOAD_MB: ${JBB_MAX_UPLOAD_MB:-500}
      JBB_MAX_DURATION_MINUTES: ${JBB_MAX_DURATION_MINUTES:-6}
      JBB_UPLOAD_RESERVATION_TTL_SECONDS: ${JBB_UPLOAD_RESERVATION_TTL_SECONDS:-7200}
      JBB_RATE_LIMIT_API_PER_MINUTE: ${JBB_RATE_LIMIT_API_PER_MINUTE:-120}
      JBB_RATE_LIMIT_CREATE_PER_WINDOW: ${JBB_RATE_LIMIT_CREATE_PER_WINDOW:-10}
      JBB_RATE_LIMIT_CREATE_WINDOW_SECONDS: ${JBB_RATE_LIMIT_CREATE_WINDOW_SECONDS:-600}
      JBB_TRUST_PROXY_HEADERS: ${JBB_TRUST_PROXY_HEADERS:-1}
      JBB_CORS_ORIGINS: ${JBB_CORS_ORIGINS:-https://jubianbian.com,https://www.jubianbian.com}
      JBB_RETENTION_DAYS: ${JBB_RETENTION_DAYS:-30}
      JBB_COOKIE_SECURE: ${JBB_COOKIE_SECURE:-1}
      JBB_LOG_LEVEL: ${JBB_LOG_LEVEL:-INFO}
      JBB_LOG_MAX_BYTES: ${JBB_LOG_MAX_BYTES:-5242880}
      JBB_LOG_BACKUP_COUNT: ${JBB_LOG_BACKUP_COUNT:-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-whisper-1}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-4o-mini}
      HF_HOME: /app/data/models/huggingface
      JBB_LOCAL_ASR_MODEL: ${JBB_LOCAL_ASR_MODEL:-small}
      JBB_LOCAL_ASR_DEVICE: ${JBB_LOCAL_ASR_DEVICE:-cpu}
      JBB_LOCAL_ASR_COMPUTE_TYPE: ${JBB_LOCAL_ASR_COMPUTE_TYPE:-int8}
      JBB_LOCAL_ASR_LANGUAGE: ${JBB_LOCAL_ASR_LANGUAGE:-zh}
      JBB_LOCAL_ASR_BEAM_SIZE: ${JBB_LOCAL_ASR_BEAM_SIZE:-5}
      JBB_LOCAL_ASR_VAD_MIN_SPEECH_MS: ${JBB_LOCAL_ASR_VAD_MIN_SPEECH_MS:-100}
      JBB_LOCAL_ASR_VAD_MIN_SILENCE_MS: ${JBB_LOCAL_ASR_VAD_MIN_SILENCE_MS:-300}
      JBB_LOCAL_ASR_VAD_SPEECH_PAD_MS: ${JBB_LOCAL_ASR_VAD_SPEECH_PAD_MS:-200}
      JBB_OCR_LANG: ${JBB_OCR_LANG:-chi_sim+eng}
      JBB_OCR_SAMPLE_INTERVAL_SECONDS: ${JBB_OCR_SAMPLE_INTERVAL_SECONDS:-1.0}
      JBB_OCR_MAX_FRAMES: ${JBB_OCR_MAX_FRAMES:-180}
      ARK_API_KEY: ${ARK_API_KEY:-}
      ARK_API_KEY_2: ${ARK_API_KEY_2:-}
      ARK_BASE_URL: ${ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      ARK_MODEL: ${ARK_MODEL:-doubao-seed-2-1-turbo-260628}
      ARK_LITE_MODEL: ${ARK_LITE_MODEL:-doubao-seed-2-0-lite-260428}
      ARK_TURBO_MODEL: ${ARK_TURBO_MODEL:-doubao-seed-2-1-turbo-260628}
      ARK_ROUTING_MODE: ${ARK_ROUTING_MODE:-complexity}
      ARK_VIDEO_FPS: ${ARK_VIDEO_FPS:-1.0}
      ARK_VIDEO_SOURCE_MODE: ${ARK_VIDEO_SOURCE_MODE:-auto}
      ARK_MAX_OUTPUT_TOKENS: ${ARK_MAX_OUTPUT_TOKENS:-32768}
      ARK_FILE_POLL_SECONDS: ${ARK_FILE_POLL_SECONDS:-1}
      ARK_UPLOAD_PROXY_MAX_MB: ${ARK_UPLOAD_PROXY_MAX_MB:-4}
      ARK_UPLOAD_PROXY_MAX_HEIGHT: ${ARK_UPLOAD_PROXY_MAX_HEIGHT:-540}
      ARK_UPLOAD_PROXY_VIDEO_BITRATE: ${ARK_UPLOAD_PROXY_VIDEO_BITRATE:-400k}
      ARK_UPLOAD_PROXY_AUDIO_BITRATE: ${ARK_UPLOAD_PROXY_AUDIO_BITRATE:-32k}
      ARK_UPLOAD_PROXY_PRESET: ${ARK_UPLOAD_PROXY_PRESET:-veryfast}
      ARK_UPLOAD_PROXY_TIMEOUT_SECONDS: ${ARK_UPLOAD_PROXY_TIMEOUT_SECONDS:-180}
      ARK_UPLOAD_TIMEOUT_SECONDS: ${ARK_UPLOAD_TIMEOUT_SECONDS:-240}
      ARK_UPLOAD_ATTEMPTS: ${ARK_UPLOAD_ATTEMPTS:-3}
      JBB_ARK_UPLOAD_MAX_IN_FLIGHT: ${JBB_ARK_UPLOAD_MAX_IN_FLIGHT:-2}
      ARK_RESPONSE_TIMEOUT_SECONDS: ${ARK_RESPONSE_TIMEOUT_SECONDS:-420}
      ARK_RESPONSE_POLL_SECONDS: ${ARK_RESPONSE_POLL_SECONDS:-5}
      ARK_RESPONSE_POLL_TIMEOUT_SECONDS: ${ARK_RESPONSE_POLL_TIMEOUT_SECONDS:-900}
      ARK_RESPONSE_CREATE_ATTEMPTS: ${ARK_RESPONSE_CREATE_ATTEMPTS:-2}
      ARK_THINKING_TYPE: ${ARK_THINKING_TYPE:-disabled}
      ARK_FALLBACK_ON_ERROR: ${ARK_FALLBACK_ON_ERROR:-1}
      JBB_OBJECT_STORAGE_ENDPOINT: ${JBB_OBJECT_STORAGE_ENDPOINT:-}
      JBB_OBJECT_STORAGE_BUCKET: ${JBB_OBJECT_STORAGE_BUCKET:-}
      JBB_OBJECT_STORAGE_REGION: ${JBB_OBJECT_STORAGE_REGION:-auto}
      JBB_OBJECT_STORAGE_ACCESS_KEY: ${JBB_OBJECT_STORAGE_ACCESS_KEY:-}
      JBB_OBJECT_STORAGE_SECRET_KEY: ${JBB_OBJECT_STORAGE_SECRET_KEY:-}
      JBB_OBJECT_STORAGE_ADDRESSING_STYLE: ${JBB_OBJECT_STORAGE_ADDRESSING_STYLE:-path}
      JBB_OBJECT_STORAGE_PRESIGN_SECONDS: ${JBB_OBJECT_STORAGE_PRESIGN_SECONDS:-3600}
      JBB_OBJECT_STORAGE_PREFIX: ${JBB_OBJECT_STORAGE_PREFIX:-jubianbian/uploads}
      JBB_WORKER_CONCURRENCY: ${JBB_WORKER_CONCURRENCY:-8}
      JBB_ARK_MAX_IN_FLIGHT: ${JBB_ARK_MAX_IN_FLIGHT:-4}
      JBB_EVIDENCE_CONCURRENCY: ${JBB_EVIDENCE_CONCURRENCY:-2}
      TENCENTCLOUD_SECRET_ID: ${TENCENTCLOUD_SECRET_ID:-}
      TENCENTCLOUD_SECRET_KEY: ${TENCENTCLOUD_SECRET_KEY:-}
      TENCENTCLOUD_REGION: ${TENCENTCLOUD_REGION:-ap-guangzhou}
      TENCENTCLOUD_SES_ENDPOINT: ${TENCENTCLOUD_SES_ENDPOINT:-ses.tencentcloudapi.com}
      TENCENTCLOUD_SES_FROM_EMAIL: ${TENCENTCLOUD_SES_FROM_EMAIL:-}
      TENCENTCLOUD_SES_FROM_NAME: ${TENCENTCLOUD_SES_FROM_NAME:-剧编编}
      TENCENTCLOUD_SES_TEMPLATE_ID: ${TENCENTCLOUD_SES_TEMPLATE_ID:-0}
      # Never expose a verification code from a deployed container. Local
      # development can run uvicorn with JBB_AUTH_ALLOW_DEV_CODE=1 instead.
      JBB_AUTH_ALLOW_DEV_CODE: "0"
      JBB_AUTH_CODE_RESEND_SECONDS: ${JBB_AUTH_CODE_RESEND_SECONDS:-60}
      JBB_AUTH_CODE_MAX_ATTEMPTS: ${JBB_AUTH_CODE_MAX_ATTEMPTS:-5}
    volumes:
      - jbb-data:/app/data
    restart: unless-stopped

  proxy:
    image: caddy:2.9-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  jbb-data:
  caddy-data:
  caddy-config:
