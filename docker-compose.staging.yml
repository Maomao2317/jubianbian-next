services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "18000:8000"
    expose:
      - "8000"
    environment:
      JBB_ENVIRONMENT: staging
      JBB_BUILD_VERSION: ${JBB_BUILD_VERSION:-unknown}
      JBB_DATA_DIR: /app/data
      JBB_MAX_UPLOAD_MB: ${JBB_MAX_UPLOAD_MB:-500}
      JBB_MAX_DURATION_MINUTES: ${JBB_MAX_DURATION_MINUTES:-6}
      JBB_RATE_LIMIT_API_PER_MINUTE: ${JBB_RATE_LIMIT_API_PER_MINUTE:-120}
      JBB_RATE_LIMIT_CREATE_PER_WINDOW: ${JBB_RATE_LIMIT_CREATE_PER_WINDOW:-10}
      JBB_RATE_LIMIT_CREATE_WINDOW_SECONDS: ${JBB_RATE_LIMIT_CREATE_WINDOW_SECONDS:-600}
      JBB_TRUST_PROXY_HEADERS: ${JBB_TRUST_PROXY_HEADERS:-1}
      JBB_CORS_ORIGINS: ${JBB_CORS_ORIGINS:-https://test.jubianbian.com}
      JBB_RETENTION_DAYS: ${JBB_RETENTION_DAYS:-30}
      JBB_COOKIE_SECURE: ${JBB_COOKIE_SECURE:-1}
      JBB_LOG_LEVEL: ${JBB_LOG_LEVEL:-INFO}
      JBB_LOG_MAX_BYTES: ${JBB_LOG_MAX_BYTES:-5242880}
      JBB_LOG_BACKUP_COUNT: ${JBB_LOG_BACKUP_COUNT:-5}
      JBB_ADMIN_EMAILS: ${JBB_ADMIN_EMAILS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-whisper-1}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-4o-mini}
      ARK_API_KEY: ${ARK_API_KEY:-}
      ARK_API_KEY_2: ${ARK_API_KEY_2:-}
      ARK_BASE_URL: ${ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      ARK_MODEL: ${ARK_MODEL:-doubao-seed-2-1-turbo-260628}
      ARK_LITE_MODEL: ${ARK_LITE_MODEL:-doubao-seed-2-1-lite-260915}
      ARK_TURBO_MODEL: ${ARK_TURBO_MODEL:-doubao-seed-2-1-turbo-260628}
      ARK_ROUTING_MODE: ${ARK_ROUTING_MODE:-complexity}
      ARK_VIDEO_FPS: ${ARK_VIDEO_FPS:-0.5}
      ARK_FILE_POLL_SECONDS: ${ARK_FILE_POLL_SECONDS:-1}
      ARK_FALLBACK_ON_ERROR: ${ARK_FALLBACK_ON_ERROR:-1}
      JBB_WORKER_CONCURRENCY: ${JBB_WORKER_CONCURRENCY:-8}
      VOLCENGINE_ACCESS_KEY: ${VOLCENGINE_ACCESS_KEY:-}
      VOLCENGINE_SECRET_KEY: ${VOLCENGINE_SECRET_KEY:-}
      TENCENTCLOUD_SECRET_ID: ${TENCENTCLOUD_SECRET_ID:-}
      TENCENTCLOUD_SECRET_KEY: ${TENCENTCLOUD_SECRET_KEY:-}
      TENCENTCLOUD_REGION: ${TENCENTCLOUD_REGION:-ap-guangzhou}
      TENCENTCLOUD_SES_ENDPOINT: ${TENCENTCLOUD_SES_ENDPOINT:-ses.tencentcloudapi.com}
      TENCENTCLOUD_SES_FROM_EMAIL: ${TENCENTCLOUD_SES_FROM_EMAIL:-}
      TENCENTCLOUD_SES_FROM_NAME: ${TENCENTCLOUD_SES_FROM_NAME:-剧编编}
      TENCENTCLOUD_SES_TEMPLATE_ID: ${TENCENTCLOUD_SES_TEMPLATE_ID:-0}
      # Staging is internet-facing and must exercise the real email path.
      JBB_AUTH_ALLOW_DEV_CODE: "0"
      JBB_AUTH_CODE_RESEND_SECONDS: ${JBB_AUTH_CODE_RESEND_SECONDS:-60}
      JBB_AUTH_CODE_MAX_ATTEMPTS: ${JBB_AUTH_CODE_MAX_ATTEMPTS:-5}
    volumes:
      - jbb-staging-data:/app/data
    restart: unless-stopped

volumes:
  jbb-staging-data:
